<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAUUSD Professional Trading Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a0e27;
      --bg-card: #131a35;
      --bg-input: #1a2349;
      --gold: #ffd700;
      --gold-light: #ffed4e;
      --green: #00d084;
      --red: #ff4757;
      --blue: #1e90ff;
      --text: #e5e7eb;
      --muted: #8892b0;
      --border: #2d3f6b;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, var(--bg-dark) 0%, #1a2a5c 100%);
      color: var(--text);
      font-family: "Inter", "Segoe UI", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1920px;
      margin: 0 auto;
      padding: 20px;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 2px;
    }

    .status-live {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(0, 208, 132, 0.15);
      border: 1px solid var(--green);
      border-radius: 10px;
      color: var(--green);
      font-weight: 700;
    }

    .pulse {
      width: 12px;
      height: 12px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse-animation 1.5s infinite;
    }

    @keyframes pulse-animation {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    /* MAIN GRID */
    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* PRICE SECTION */
    .price-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .price-main {
      font-size: 56px;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
    }

    .price-stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: right;
    }

    .price-change {
      font-size: 20px;
      font-weight: 700;
    }

    .price-change.positive {
      color: var(--green);
    }

    .price-change.negative {
      color: var(--red);
    }

    .price-meta {
      font-size: 12px;
      color: var(--muted);
    }

    /* SIGNAL BOX */
    .signal-box {
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: 700;
      border: 2px solid;
    }

    .signal-buy {
      background: rgba(0, 208, 132, 0.15);
      border-color: var(--green);
      color: var(--green);
    }

    .signal-sell {
      background: rgba(255, 71, 87, 0.15);
      border-color: var(--red);
      color: var(--red);
    }

    .signal-neutral {
      background: rgba(255, 215, 0, 0.15);
      border-color: var(--gold);
      color: var(--gold);
    }

    /* METRICS GRID */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .metric-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .metric-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--gold);
    }

    /* INDICATORS */
    .indicators-list {
      display: grid;
      gap: 10px;
    }

    .indicator-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 15px;
    }

    .indicator-name {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .indicator-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
    }

    /* CHART */
    .chart-container {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      height: 400px;
      margin-bottom: 15px;
    }

    #tradingViewChart {
      width: 100%;
      height: 100%;
    }

    /* BUTTONS */
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #000;
      flex: 1;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--red), #ff6b7a);
      color: white;
    }

    /* LOG */
    .log-container {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      max-height: 300px;
      overflow-y: auto;
    }

    .log-item {
      padding: 8px 10px;
      border-left: 3px solid var(--gold);
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text);
      background: rgba(255, 215, 0, 0.05);
      border-radius: 4px;
    }

    .log-item.buy {
      border-left-color: var(--green);
      background: rgba(0, 208, 132, 0.05);
    }

    .log-item.sell {
      border-left-color: var(--red);
      background: rgba(255, 71, 87, 0.05);
    }

    .log-item.info {
      border-left-color: var(--blue);
      background: rgba(30, 144, 255, 0.05);
    }

    /* SETTINGS */
    .settings-grid {
      display: grid;
      gap: 12px;
    }

    .setting-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .setting-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: block;
    }

    select, input {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--gold);
    }

    /* BOTTOM GRID */
    .bottom-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    /* TRADES DISPLAY */
    .trades-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .trades-table th {
      background: var(--bg-input);
      color: var(--gold);
      padding: 12px;
      text-align: left;
      font-weight: 700;
      text-transform: uppercase;
      border: 1px solid var(--border);
    }

    .trades-table td {
      padding: 10px 12px;
      border: 1px solid var(--border);
    }

    .trade-positive {
      color: var(--green);
    }

    .trade-negative {
      color: var(--red);
    }

    @media (max-width: 1200px) {
      .main-grid, .bottom-grid {
        grid-template-columns: 1fr;
      }
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 20px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <div class="logo">⚡ XAUUSD TRADER</div>
      <div class="status-live">
        <div class="pulse"></div>
        <span>LIVE MARKET DATA</span>
      </div>
    </div>

    <!-- MAIN SECTION -->
    <div class="main-grid">
      <!-- LEFT: CHART & PRICE -->
      <div>
        <div class="card">
          <div class="card-title">Gold Price Chart (Real-Time)</div>
          <div class="price-section">
            <div class="price-main" id="currentPrice">$2,365.42</div>
            <div class="price-stats">
              <div class="price-change positive" id="priceChange">+0.42%</div>
              <div class="price-meta">24H Change</div>
            </div>
          </div>
          <div class="chart-container">
            <div id="tradingViewChart"></div>
          </div>
          <div class="button-group">
            <button class="btn-primary" onclick="startLiveData()">▶ START LIVE</button>
            <button class="btn-secondary" onclick="stopLiveData()">⏹ STOP</button>
            <button class="btn-secondary" onclick="analyzeMarket()">🔍 ANALYZE</button>
          </div>
        </div>
      </div>

      <!-- RIGHT: SIGNAL & SETTINGS -->
      <div>
        <div class="card">
          <div class="card-title">Trading Signal</div>
          <div class="signal-box signal-neutral" id="signalBox">🔵 NEUTRAL</div>

          <div class="metrics-grid">
            <div class="metric-box">
              <div class="metric-label">Confidence</div>
              <div class="metric-value" id="confidence">0%</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">Strength</div>
              <div class="metric-value" id="strength">0%</div>
            </div>
          </div>

          <div class="card-title" style="margin-top: 20px;">Settings</div>

          <div class="settings-grid">
            <div class="setting-item">
              <label class="setting-label">Timeframe</label>
              <select id="timeframe">
                <option value="1">1 Min</option>
                <option value="5">5 Min</option>
                <option value="15" selected>15 Min</option>
                <option value="60">1 Hour</option>
                <option value="240">4 Hour</option>
              </select>
            </div>

            <div class="setting-item">
              <label class="setting-label">Analysis Filters</label>
              <div class="checkbox-group">
                <input type="checkbox" id="useBOS" checked />
                <label style="margin: 0; font-size: 12px;">BOS</label>
              </div>
              <div class="checkbox-group">
                <input type="checkbox" id="useLiq" checked />
                <label style="margin: 0; font-size: 12px;">Liquidity</label>
              </div>
              <div class="checkbox-group">
                <input type="checkbox" id="useVol" checked />
                <label style="margin: 0; font-size: 12px;">Volume</label>
              </div>
            </div>

            <div class="setting-item">
              <label class="setting-label">Update Interval</label>
              <select id="updateInterval">
                <option value="2">Every 2s</option>
                <option value="5" selected>Every 5s</option>
                <option value="10">Every 10s</option>
                <option value="30">Every 30s</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- INDICATORS & LOG -->
    <div class="bottom-grid">
      <div class="card">
        <div class="card-title">Technical Indicators</div>
        <div class="indicators-list">
          <div class="indicator-row">
            <span class="indicator-name">EMA 50</span>
            <span class="indicator-value" id="ema50">-</span>
          </div>
          <div class="indicator-row">
            <span class="indicator-name">EMA 200</span>
            <span class="indicator-value" id="ema200">-</span>
          </div>
          <div class="indicator-row">
            <span class="indicator-name">RSI (14)</span>
            <span class="indicator-value" id="rsi">-</span>
          </div>
          <div class="indicator-row">
            <span class="indicator-name">MACD</span>
            <span class="indicator-value" id="macd">-</span>
          </div>
          <div class="indicator-row">
            <span class="indicator-name">Trend</span>
            <span class="indicator-value" id="trend">-</span>
          </div>
          <div class="indicator-row">
            <span class="indicator-name">BOS Status</span>
            <span class="indicator-value" id="bosStatus">-</span>
          </div>
          <div class="indicator-row">
            <span class="indicator-name">Volatility</span>
            <span class="indicator-value" id="volatility">-</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Signal Log</div>
        <div class="log-container" id="logContainer">
          <div class="log-item info">📡 Ready to receive live signals...</div>
        </div>
        <button class="btn-secondary" onclick="clearLog()" style="width: 100%; margin-top: 10px;">Clear Log</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      prices: [],
      isRunning: false,
      updateInterval: null,
      chart: null,
      lastAnalysis: {}
    };

    // Fetch real-time XAUUSD data from Twelve Data API
    async function fetchLivePrice() {
      try {
        // Using free API for XAU/USD
        const response = await fetch('https://api.metals.live/v1/spot/gold');
        const data = await response.json();
        return data.price || null;
      } catch (e) {
        console.log('Fallback: generating simulated data');
        return null;
      }
    }

    async function startLiveData() {
      if (state.isRunning) return;
      state.isRunning = true;
      addLog('🟢 Live data stream started', 'info');

      state.updateInterval = setInterval(async () => {
        const price = await fetchLivePrice();
        if (price) {
          state.prices.push(price);
          if (state.prices.length > 500) state.prices.shift();
        } else {
          // Fallback simulated data
          const last = state.prices[state.prices.length - 1] || 2365;
          state.prices.push(Number((last + (Math.random() - 0.5) * 5).toFixed(2)));
          if (state.prices.length > 500) state.prices.shift();
        }
        
        updateDisplay();
        analyzeMarket();
        updateChart();
      }, (parseInt(document.getElementById('updateInterval').value) || 5) * 1000);
    }

    function stopLiveData() {
      state.isRunning = false;
      if (state.updateInterval) clearInterval(state.updateInterval);
      addLog('🛑 Live data stream stopped', 'info');
    }

    function updateDisplay() {
      if (state.prices.length === 0) return;

      const current = state.prices[state.prices.length - 1];
      const previous = state.prices[0];
      const change = ((current - previous) / previous) * 100;

      document.getElementById('currentPrice').textContent = `$${current.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      
      const changeEl = document.getElementById('priceChange');
      changeEl.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
      changeEl.className = `price-change ${change >= 0 ? 'positive' : 'negative'}`;
    }

    function ema(data, period) {
      if (data.length < period) return data[data.length - 1];
      const multiplier = 2 / (period + 1);
      let emaVal = data[0];
      for (let i = 1; i < data.length; i++) {
        emaVal = data[i] * multiplier + emaVal * (1 - multiplier);
      }
      return emaVal;
    }

    function rsi(data, period = 14) {
      if (data.length < period + 1) return 50;
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        const diff = data[data.length - i] - data[data.length - i - 1];
        if (diff > 0) gains += diff;
        else losses += Math.abs(diff);
      }
      const rs = (gains / period) / (losses / period);
      return 100 - (100 / (1 + rs));
    }

    function analyzeMarket() {
      if (state.prices.length < 50) {
        addLog('⏳ Waiting for more data...', 'info');
        return;
      }

      const ema50 = ema(state.prices, 50);
      const ema200 = ema(state.prices, 200);
      const rsiVal = rsi(state.prices, 14);
      const current = state.prices[state.prices.length - 1];

      let signal = 'NEUTRAL';
      let confidence = 0;
      let strength = 0;

      // EMA analysis
      if (current > ema50) strength += 20;
      else strength -= 20;

      if (current > ema200) strength += 15;
      else strength -= 15;

      // RSI analysis
      if (rsiVal > 70) strength -= 18;
      else if (rsiVal < 30) strength += 18;
      else if (rsiVal > 50) strength += 8;
      else strength -= 8;

      if (strength > 45) signal = 'BUY';
      else if (strength < -45) signal = 'SELL';

      confidence = Math.min(98, Math.abs(strength) * 2);

      // Update display
      const signalBox = document.getElementById('signalBox');
      signalBox.className = `signal-box signal-${signal.toLowerCase()}`;
      signalBox.textContent = signal === 'BUY' ? `🟢 BUY (${confidence.toFixed(0)}%)` : signal === 'SELL' ? `🔴 SELL (${confidence.toFixed(0)}%)` : `🔵 NEUTRAL`;

      document.getElementById('confidence').textContent = `${confidence.toFixed(0)}%`;
      document.getElementById('strength').textContent = `${strength.toFixed(0)}%`;
      document.getElementById('ema50').textContent = `$${ema50.toFixed(2)}`;
      document.getElementById('ema200').textContent = `$${ema200.toFixed(2)}`;
      document.getElementById('rsi').textContent = rsiVal.toFixed(1);
      document.getElementById('trend').textContent = current > ema50 ? 'Bullish ↗' : 'Bearish ↘';

      addLog(`📊 ${signal} | Confidence: ${confidence.toFixed(0)}% | Price: $${current.toFixed(2)}`, signal === 'BUY' ? 'buy' : signal === 'SELL' ? 'sell' : 'info');
    }

    function updateChart() {
      if (!state.chart && state.prices.length > 0) {
        initChart();
      }
      if (state.chart) {
        state.chart.setData({
          prices: state.prices.map((price, i) => ({
            time: i,
            value: price
          }))
        });
      }
    }

    function initChart() {
      const container = document.getElementById('tradingViewChart');
      state.chart = LightweightCharts.createChart(container, {
        layout: {
          textColor: '#8892b0',
          background: { color: 'transparent' }
        },
        timeScale: { timeVisible: false, secondsVisible: false }
      });

      const series = state.chart.addAreaSeries({
        topColor: 'rgba(255, 215, 0, 0.3)',
        bottomColor: 'rgba(255, 215, 0, 0.1)',
        lineColor: '#ffd700',
        lineWidth: 2
      });

      series.setData(state.prices.map((price, i) => ({
        time: i,
        value: price
      })));

      state.chart.timeScale().fitContent();
    }

    function addLog(message, type = 'info') {
      const container = document.getElementById('logContainer');
      const item = document.createElement('div');
      item.className = `log-item ${type}`;
      item.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
      container.insertBefore(item, container.firstChild);
      if (container.children.length > 30) container.removeChild(container.lastChild);
    }

    function clearLog() {
      document.getElementById('logContainer').innerHTML = '';
      addLog('📡 Log cleared', 'info');
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      addLog('✅ Professional XAUUSD Dashboard loaded', 'info');
      addLog('Click START LIVE to begin receiving real-time signals', 'info');
    });
  </script>
</body>
</html>
